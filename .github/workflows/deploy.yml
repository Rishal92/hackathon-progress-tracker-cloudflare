name: Deploy site and API

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-cloudflare:
    name: Deploy Cloudflare Worker and D1 schema
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_ORIGIN_GITHUB: ${{ secrets.PAGES_ORIGIN_GITHUB }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate required Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN secret."
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing CLOUDFLARE_ACCOUNT_ID secret."
            exit 1
          fi

          if [ -z "$PAGES_ORIGIN_GITHUB" ]; then
            echo "Missing PAGES_ORIGIN_GITHUB secret."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run validation checks
        run: |
          npm run check:site
          npm run check:worker

      - name: Apply D1 schema
        run: npx wrangler d1 execute hackathon-progress-db --remote --file=worker/schema.sql --config worker/wrangler.toml

      - name: Deploy Worker
        run: npx wrangler deploy --config worker/wrangler.toml --var ALLOWED_ORIGIN:${PAGES_ORIGIN_GITHUB}

  deploy-site:
    name: Deploy GitHub Pages site
    runs-on: ubuntu-latest
    needs: deploy-cloudflare
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      WORKER_API_BASE_URL: ${{ secrets.WORKER_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate required site secret
        run: |
          if [ -z "$WORKER_API_BASE_URL" ]; then
            echo "Missing WORKER_API_BASE_URL secret."
            exit 1
          fi

      - name: Build static site artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R site/. _site/
          sed -i "s|https://REPLACE_WITH_YOUR_WORKER_URL|${WORKER_API_BASE_URL}|g" _site/app.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
